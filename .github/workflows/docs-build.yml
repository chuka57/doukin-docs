name: Docs build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # For PRs, test the merge result so existing PR branches also get
          # the checker/publisher tests introduced on main.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test publishing logic
        run: python -m unittest discover -s tests -v
      - name: Build and check the guide
        run: |
          python scripts/build_html.py
          python scripts/check_html.py docs
          git diff --exit-code -- docs
      - name: Upload same-repository PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: docs/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7
