name: Publish docs and PR previews

on:
  workflow_run:
    workflows: [Docs build]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

# Only the default-branch publisher has write permissions. PR Python and
# workflow changes run in Docs build with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: docs-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.path == '.github/workflows/docs-build.yml') ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out trusted publisher and production sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Assemble production and all open previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_html.py
          python scripts/check_html.py docs
          python scripts/publish_pages.py assemble
      - name: Upload combined Pages site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/docs-pages-site
          include-hidden-files: true
      - name: Deploy production and previews together
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Update PR comments after successful deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: python scripts/publish_pages.py comment
